<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#180d27">
    <title>GTA VI | Countdown</title>
    <link rel="stylesheet" href="CSS/estilos.css">
    <script src="JS/contador.js" defer></script>
</head>
<body>
    <main class="pagina">
        <div class="velo" aria-hidden="true"></div>

        <section class="contenido" aria-label="Cuenta regresiva de GTA VI">
            <img class="logo" src="IMAGENES/logo-gta6.png" alt="Grand Theft Auto VI">

            <p class="ceja">ROCKSTAR GAMES PRESENTS</p>
            <h1>¿LISTO PARA LA <span>AVENTURA, AMOR?</span></h1>
            <p class="intro">VICE CITY NOS ESPERA...</p>

            <div class="contador" role="timer" aria-live="off" aria-label="Cuenta regresiva para el 19 de noviembre de 2026">
                <div class="unidad">
                    <span class="numero" id="dias">000</span>
                    <span class="etiqueta">DÍAS</span>
                </div>
                <div class="unidad">
                    <span class="numero" id="horas">00</span>
                    <span class="etiqueta">HORAS</span>
                </div>
                <div class="unidad">
                    <span class="numero" id="minutos">00</span>
                    <span class="etiqueta">MINUTOS</span>
                </div>
                <div class="unidad">
                    <span class="numero" id="segundos">00</span>
                    <span class="etiqueta">SEGUNDOS</span>
                </div>
            </div>

            <p class="mensaje" id="mensaje" aria-live="polite">¿Ya estás emocionado, amor? ♡</p>
            <p class="fecha">19 · NOVIEMBRE · 2026</p>
        </section>

        <footer>MADE WITH LOVE <span>♡</span></footer>
    </main>
</body>
</html>
